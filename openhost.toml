[app]
name = "immich"
version = "0.1.0"
description = "Immich self-hosted photo and video management, with OIDC bridge for OpenHost SSO"
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
# nginx fronts the entire app on :8080; the OpenHost router proxies
# this through https://<app>.<zone>/. Inside the container nginx
# routes /_oidc/* to the OIDC bridge and everything else to the
# Immich server. Postgres, Valkey, machine-learning, and the OIDC
# bridge are all internal sidecar processes supervised by s6-overlay.
image = "Dockerfile"
port = 8080

[resources]
# Immich's machine-learning service loads ~1.5 GiB of models into
# RAM at full tilt. Postgres + redis + the Node server add another
# couple hundred MiB. 6 GiB is on the lower end of what people
# self-host Immich at; bump for large libraries.
memory_mb = 6144
cpu_millicores = 3000

[routing]
# OIDC discovery and token endpoints must be public so Immich-server
# can reach them server-side (those calls don't carry an OpenHost
# session cookie). The user-facing /authorize endpoint is NOT in
# public_paths -- it needs the X-OpenHost-Is-Owner header that
# OpenHost only stamps on authenticated-owner requests, so the
# bridge can identify the owner by something other than the
# anonymous query string.
#
# OpenHost's path matcher is a prefix match, so we list each
# individual endpoint explicitly to avoid a /_oidc/ blanket entry
# accidentally exposing /authorize too.
public_paths = [
    "/_oidc/.well-known/openid-configuration",
    "/_oidc/jwks",
    "/_oidc/token",
    "/_oidc/userinfo",
]

[data]
# Two persistent tiers:
#
# app_data (local disk, low-latency, transactional):
#   /data/app_data/immich/postgres/   -- Postgres DB.  MUST stay on
#                                        local because Postgres WAL
#                                        + JuiceFS's close-to-open
#                                        consistency is a known
#                                        corruption recipe.
#   /data/app_data/immich/config/     -- system.json, ML model cache.
#                                        Read at process start; would
#                                        be silly to make it slow.
#   /data/app_data/immich/oidc/       -- OIDC bridge RSA signing key +
#                                        state.  Hot path for every
#                                        login.  Tiny.
#   /data/app_data/immich/secrets/    -- DB password + OIDC client
#                                        secret.  Tiny, hot.
#
# app_archive (operator-configurable: local OR S3-via-JuiceFS):
#   /data/app_archive/immich/photos/  -- IMMICH_MEDIA_LOCATION.  Bulk
#                                        media (originals + transcodes
#                                        + thumbnails).  Write-heavy
#                                        on import, then mostly-read
#                                        with infrequent re-encodes.
#                                        The whole point of the
#                                        archive tier exists for this
#                                        kind of workload: a single-
#                                        digit-MiB Postgres DB plus
#                                        terabytes of media that the
#                                        operator wants on cheap S3.
#
# Migration note: an existing immich install with photos on app_data
# will NOT be auto-migrated by upgrading to this manifest.  After
# upgrade the operator must manually move
#   /data/app_data/immich/photos/  ->  /data/app_archive/immich/photos/
# from the host (or via ``oh app exec``).  We don't do this in the
# prepare script because rmtree-style migrations of multi-GiB photo
# libraries deserve operator awareness, not silent automation.
app_data = true
app_archive = true
