worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Immich uploads can be large; raise the body limit accordingly.
    # 10 GiB matches the default of the official immich nginx config
    # used in their reverse-proxy docs.
    client_max_body_size 10g;
    client_body_timeout 300s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Pass through both Connection: upgrade and the Upgrade header so
    # WebSocket connections (Immich's live notifications and ML
    # bidirectional channels) work end-to-end.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log combined;

    upstream immich_server {
        # immich-server inside the same container, listening on its
        # default port 2283 (set via SERVER_PORT in start.sh; we
        # override the upstream image's default of 8080 because we
        # claim 8080 for nginx itself).
        server 127.0.0.1:2283;
    }

    upstream oidc_bridge {
        # The OIDC bridge runs on 127.0.0.1:9000.
        server 127.0.0.1:9000;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;

        # /_oidc/* is the bridge. We split it out before the catch-all
        # so the OIDC discovery URL, JWKS, and authorize/token
        # endpoints reach the bridge regardless of how Immich tries to
        # match its own routes.
        location /_oidc/ {
            proxy_pass http://oidc_bridge;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            # Pass the OpenHost owner header through. nginx by
            # default forwards all headers, but be explicit so a
            # future override can't accidentally strip it.
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
            proxy_set_header X-OpenHost-Owner-Email $http_x_openhost_owner_email;
        }

        # Everything else is Immich. The catch-all is at the end so
        # /_oidc/* doesn't fall through to it.
        location / {
            proxy_pass http://immich_server;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect off;
            proxy_buffering off;
        }
    }
}
